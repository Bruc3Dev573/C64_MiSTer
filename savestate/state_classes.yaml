- match: "emu.reu.addr_mask"
  class: rebuilt
  reason: assigned with '=' every clock from cfg (REU size option, configuration) before use
- match: "emu.reu.error"
  class: rebuilt
  reason: assigned with '=' every clock from op_act and data[] (saved) before use (verify mismatch)
- match: "emu.reu.dma_*"
  class: rebuilt
  reason: REU output to the C64 bus (DMA request, address, data, write), read on every clock outside the REU; never shifts, written back from its copy ss_dma_* (saved) on ss_load_done
- match: "emu.reu.ram_*"
  class: rebuilt
  reason: REU output to the SDRAM port (address, data, write), read on every clock outside the REU; never shifts, written back from its copy ss_ram_* (saved) on ss_load_done
- match: "emu.reu.irq"
  class: rebuilt
  reason: REU IRQ line to the CPU, read on every clock outside the REU; never shifts, written back from its copy ss_irq (saved) on ss_load_done
- match: "emu.reu.cpu_din"
  class: rebuilt
  reason: REU register read data on the IO bus, read on every clock outside the REU; never shifts, written back from its copy ss_cpu_din (saved) on ss_load_done
- match: "emu.reu.*"
  class: arch
  segment: REU

