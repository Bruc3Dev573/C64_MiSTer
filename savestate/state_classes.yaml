# ============================================================== fpga64_sid_iec glue (bus timing, TOD, banking)
#
# A savestate stops and releases the machine on one point of the 32-clock bus
# cycle grid only: the pause input is sampled at preCycle = pred(CYCLE_EXT4)
# with rfsh_cycle = 0, sysCycle then stays CYCLE_EXT4 until the release on the
# same sample (ss_freeze, docs/SAVESTATES.md). The grid registers below hold
# the same value at every such point, so the live value at a load is the one
# of the save. They are also the freeze itself and the enables of the chips:
# shifting them would run the machine or the SDRAM refresh during a save.

- match: "emu.fpga64.precycle"
  class: rebuilt
  reason: free-running position in the 32-clock C64 cycle; never stops (SDRAM refresh), the freeze releases the machine on the same position it stopped on
- match: "emu.fpga64.rfsh_cycle"
  class: rebuilt
  reason: counts C64 cycles only while sysEnable is 1; the freeze is sampled with rfsh_cycle = 0 and it stays 0 until the release
- match: "emu.fpga64.sysenable"
  class: rebuilt
  reason: the freeze itself (0 from the stop to the release sample, which sets it from the pause input); owned by ss_freeze
- match: "emu.fpga64.refresh"
  class: rebuilt
  reason: one-clock pulse at preCycle = pred(CYCLE_EXT4) with rfsh_cycle = 0, rewritten every clock from preCycle/rfsh_cycle; keeps pulsing for the SDRAM while frozen
- match: "emu.fpga64.reset"
  class: rebuilt
  reason: not reset_n, sampled at the end of each C64 cycle; 0 at a savestate boundary (idle bit 1 requires reset_n with no reset pending, idle bit 0 requires the CPU out of reset)
- match: "emu.fpga64.enable*"
  class: rebuilt
  reason: one-clock chip enables decoded from sysCycle (enableVic at VIC2/CPUE, enableCia_n/p, enableSid, enablePixel, enableCpu two clocks after a CPU access at CPU0-CPUC); all 0 with sysCycle held at CYCLE_EXT4
- match: "emu.fpga64.pulsewr_io"
  class: rebuilt
  reason: one-clock I/O write strobe at CYCLE_CPUC, rewritten every clock; 0 with sysCycle held at CYCLE_EXT4
- match: "emu.fpga64.cpu_cyc_s"
  class: rebuilt
  reason: two-clock delay of the CPU access decode (CPU0-CPUC), rewritten every clock; 00 from CYCLE_EXT0 on, so 00 at CYCLE_EXT4
- match: "emu.fpga64.io_enable"
  class: rebuilt
  reason: set at CYCLE_EXT0, cleared after the CYCLE_CPUC access (enableCpu); always 1 at CYCLE_EXT4
- match: "emu.fpga64.phi0_cpu"
  class: rebuilt
  reason: CPU half of the cycle, set at pred(CYCLE_CPU0), cleared at CYCLE_CPUF; always 0 at CYCLE_EXT4
- match: "emu.fpga64.cpuhasbus"
  class: rebuilt
  reason: set at pred(CYCLE_CPU0) for a CPU access, cleared at CYCLE_CPUF; always 0 at CYCLE_EXT4 (it also gates every chip select decoded from the CPU address while the chain shifts)
- match: "emu.fpga64.todclk"
  class: rebuilt
  reason: the CIAs sample their TOD input on every clock, so todclk never shifts; written back from ss_todclk (saved) on ss_load_done and held while frozen
- match: "emu.fpga64.ss_todclk"
  class: arch
  segment: SYS
- match: "emu.fpga64.tod_sum"
  class: arch
  segment: SYS
- match: "emu.fpga64.dma_active"
  class: arch
  segment: SYS
- match: "emu.fpga64.lastvicdi"
  class: arch
  segment: SYS
- match: "emu.fpga64.turbo_*"
  class: arch
  segment: SYS
- match: "emu.fpga64.vicaddr1514"
  class: arch
  segment: SYS
- match: "emu.fpga64.vicbus"
  class: arch
  segment: SYS
# cia2_pai[7:6] (IEC CLK/DATA input latch)
- match: "emu.fpga64.cia2_pai_iec"
  class: arch
  segment: SYS
- match: "emu.fpga64.buslogic.c64*_ena"
  class: arch
  segment: SYS

# ============================================================== CPU 6510

- match: "emu.fpga64.cpu.currentio"
  class: rebuilt
  reason: rewritten every clock from ioData/ioDir and the port pins (held while the engine owns the machine), drives the cassette lines and the banking, so it never shifts; written back from ss_currentio (saved, keeps the input bits that hold their level) on ss_load_done
- match: "emu.fpga64.cpu.cpu.res_n_?"
  class: rebuilt
  reason: T65 reset synchroniser, the asynchronous reset of every T65 register (never shifts); 1 at an instruction boundary (Sync needs the T65 out of reset, idle bit 1 no reset pending)
- match: "emu.fpga64.cpu.*"
  class: arch
  segment: CPU

# ============================================================== VIC-II

- match: "emu.fpga64.vic.vblanking"
  class: rebuilt
  reason: vBlanking, rewritten every clock as (rasterY = rasterBlank) from the saved rasterY; only drives the vSync output
- match: "emu.fpga64.vic.*"
  class: arch
  segment: VIC

# ============================================================== CIAs

- match: "emu.fpga64.cia?.pa_out"
  class: rebuilt
  reason: drives the keyboard matrix (CIA1), the VIC bank and the IEC bus (CIA2) on every clock, so it never shifts; written back from ss_pa_out (saved) on ss_load_done, changes only on phi2 otherwise
- match: "emu.fpga64.cia?.pb_out"
  class: rebuilt
  reason: drives the keyboard matrix (CIA1) and the parallel cable/user port (CIA2) on every clock, so it never shifts; written back from ss_pb_out (saved) on ss_load_done
- match: "emu.fpga64.cia?.pc_n"
  class: rebuilt
  reason: PC2 strobe of the parallel cable (drive_stb_i) and the user port, sampled by the drives on every clock, so it never shifts; written back from ss_pc_n (saved) on ss_load_done
- match: "emu.fpga64.cia?.old_flag"
  class: rebuilt
  reason: edge detector of the live FLAG pin (cassette read, user port, parallel cable strobe); follows the pin on every clock, also while the engine owns the machine, when it latches no edge (a load presents the loaded drive outputs before the release); a pending edge is kept in 'flag' (saved)
- match: "emu.fpga64.cia1.*"
  class: arch
  segment: CIA1
- match: "emu.fpga64.cia2.*"
  class: arch
  segment: CIA2

# ============================================================== SID (sid_top holds both chips)

- match: "emu.fpga64.sid.sid_tables.f0*"
  class: rebuilt
  reason: registered filter-curve lookup, rewritten every clock from Filter_Fc/Fc_offset (saved) of the SID selected by state[3]; sid_filter samples F0 several clocks after state moves
- match: "emu.fpga64.sid.sid_tables.*_out"
  class: rebuilt
  reason: registered combined-waveform table output, rewritten every clock from f_acc_t (saved); sid_top samples it two clocks after setting f_acc_t (states 3-13)
# output samples: they are on the chain (SID1) because the audio mix leaves
# the core on every clock and a SID cycle may be cut by the freeze
- match: "emu.fpga64.sid.audio"
  class: arch
  segment: SID1
- match: "emu.fpga64.sid.audio0"
  class: arch
  segment: SID1
- match: "emu.fpga64.sid.chip[?].v?.norm_dac"
  class: rebuilt
  reason: waveform DAC output, rewritten every clock from the saved oscillator/waveform state and control register; dac_out samples it only at ce_1m
# register files and waveform outputs of both chips: element [0] (voices 0-2
# for the *_out arrays) belongs to SID1, element [1] (voices 3-5) to SID2
- match: "emu.fpga64.sid.Voice_*"
  class: arch
  segment: [SID1, SID2]
- match: "emu.fpga64.sid.Filter_*"
  class: arch
  segment: [SID1, SID2]
- match: "emu.fpga64.sid.Fc_offset"
  class: rebuilt
  reason: copy of the OSD filter offset (fc_offset_l/r), rewritten every clock from the host port
- match: "emu.fpga64.sid.bus_data"
  class: arch
  segment: [SID1, SID2]
- match: "emu.fpga64.sid._st_out"
  class: arch
  segment: [SID1, SID2]
- match: "emu.fpga64.sid.p_t_out"
  class: arch
  segment: [SID1, SID2]
- match: "emu.fpga64.sid.ps__out"
  class: arch
  segment: [SID1, SID2]
- match: "emu.fpga64.sid.pst_out"
  class: arch
  segment: [SID1, SID2]
- match: "emu.fpga64.sid.chip[1].*"
  class: arch
  segment: SID2
- match: "emu.fpga64.sid.*"
  class: arch
  segment: SID1

# ============================================================== keyboard (matrix and hotkeys), mouse

- match: "emu.fpga64.keyboard.ps2_stb"
  class: ignored
  reason: toggle-edge detector of the PS/2 strobe (emu.key[10], from the host); must follow the live strobe, restoring it would replay the last key event
- match: "emu.fpga64.keyboard.pa?"
  class: rebuilt
  reason: keyboard matrix output to CIA1 port A, rewritten every clock from CIA1 port B output, key matrix (saved) and joysticks (live host input)
- match: "emu.fpga64.keyboard.pb?"
  class: rebuilt
  reason: keyboard matrix output to CIA1 port B, rewritten every clock from CIA1 port A output, key matrix (saved) and joysticks (live host input)
- match: "emu.fpga64.keyboard.tape_*"
  class: rebuilt
  reason: one-clock datassette hotkey pulse, cleared every clock and set only by a new PS/2 event
- match: "emu.fpga64.keyboard.*"
  class: ignored
  reason: PS/2 key matrix, modifier keys and the shifted-key delay, host keyboard input; D3, cleared by kbd_reset on ss_load_done, so the C64 never sees a key from the save or the load
- match: "emu.mouse.old_status"
  class: ignored
  reason: toggle-edge detector of the host mouse strobe ps2_mouse[24]; must follow the live strobe, restoring it would replay the last movement
- match: "emu.mouse.*"
  class: arch
  segment: INPUT

