  class: ignored
  reason: host mount strobe made into a pulse for the units (edge, image size, write protect), held while the engine owns the machine; idle at freeze and load
- match: "emu.iec_drive.c1541.mount_seed"
  class: ignored
  reason: free-running count that gives each mount an identity (host side, compared by the units on load)
- match: "emu.iec_drive.c1541.*"
  class: arch
  segment: DRV8_1541
  # shared by both 1541 units (ph2 divider, ROM fetch, IEC synchronizers); owned by unit 8
- match: "emu.iec_drive.c1581.stop_r"
  class: rebuilt
  reason: c64_pause delayed by one and two clocks (the stop of the 1581 units, and their hold for the engine one clock later); constant 1 while frozen
- match: "emu.iec_drive.c1581.rst_sync.*"
  class: rebuilt
  reason: synchroniser of the 1581 reset (host/OSD level, drive type at mount), follows it; the units see it released while the engine owns the machine
- match: "emu.iec_drive.c1581.out_h"
  class: rebuilt
  reason: holds the 1581 outputs (IEC, parallel cable, LEDs) while the engine owns the machine and follows them otherwise, so the outputs never move while the chain shifts; takes the loaded outputs on ss_load_done
- match: "emu.iec_drive.c1581.mnt_*"
  class: ignored
  reason: host mount strobe made into a pulse for the units (edge, image size, write protect), held while the engine owns the machine; idle at freeze and load
- match: "emu.iec_drive.c1581.state"
  class: rebuilt
  reason: step of the ROM fetch of the 1581 CPUs; while the drives are stopped the fetch repeats, so every byte is fetched again from the held CPU addresses before the drives run
- match: "emu.iec_drive.c1581.mem_a"
  class: rebuilt
  reason: ROM address of the fetch, rewritten from the CPU addresses (saved) by the fetch that repeats while the drives are stopped
- match: "emu.iec_drive.c1581.drv_data"
  class: rebuilt
  reason: ROM bytes at the CPU addresses, fetched again while the drives are stopped (a stop lasts a whole C64 cycle or more, and a load ends long after the chain moved), so they are those of the loaded addresses before a CPU reads them
- match: "emu.iec_drive.c1581.*"
  class: arch
  segment: DRV8_1581
  # shared by both 1581 units (ph2 divider, IEC synchronizers, ph2 pulses); owned by unit 8

# ============================================================== savestate engine (A2)
# The engine, its request queue, UI and the SDRAM/DDR3/Color RAM ports run
# the save/load itself: they are not machine state and must keep their live
# value across a load (restoring them would restart or abort the operation).
- match: "emu.ss_*"
  class: ignored
  reason: savestate engine, statemanager, UI, freeze controller and memory ports (A2); run the save/load, not machine state
# Hotkey strobe parity (c64.sv): tracks the host PS/2 strobe so eaten
# Ctrl+Alt+F1..F4 events never reach the C64; restoring an old value would
# inject or drop one key event.
- match: "emu.kbd_par"
  class: ignored
  reason: host keyboard strobe bookkeeping (savestate hotkeys), follows the live host strobe
