# ============================================================== RTC (PCF8583 on the cassette port)

- match: "emu.rtcF83.flg"
  class: rebuilt
  reason: edge detector of the host RTC toggle (RTC[64], time sent by Main at core load); follows the live toggle while running, so a host update made while stopped lands at the resume; restoring it would replay the host time over the saved one
- match: "emu.rtcF83.sda_o"
  class: rebuilt
  reason: I2C data out on the cassette read line, read on every clock; never shifts, written back from its copy ss_sda_o (saved) on ss_load_done
- match: "emu.rtcF83.*"
  class: arch
  segment: RTC

# ============================================================== OPL3 (SFX Sound Expander)

- match: "emu.opl_inst.fmreg"
  class: rebuilt
  reason: register values the FM part has or will take from its queue (it is not saved and runs on across a load); follows the C64 writes like the shadow, and after a load the replay queues every register where the loaded shadow differs and copies it here
- match: "emu.opl_inst.clr"
  class: rebuilt
  reason: walks the register shadow and fmreg to zero while the OPL is in reset (the firmware zeroes every register there); runs only while rst_n is low and one pass after it, and there is no save or load during a C64 reset; with the Sound Expander off the region is not in the slot
- match: "emu.opl_inst.rp"
  class: rebuilt
  reason: replay step after a load (the registers that differ between the loaded shadow and fmreg queued as register writes, then the saved index); 0 at every save, because a load holds the machine and the next operation until it ends (ss_replay)
- match: "emu.opl_inst.ss_rgn_ack"
  class: rebuilt
  reason: one-clock acknowledge of an engine region access, idle between accesses
- match: "emu.opl_inst.opl3.*"
  class: rebuilt
  reason: FM part in clk_opl (Z80 firmware, its RAM, register queue, sample sequencer, pause synchronizer). Not saved and not reset by a load; the replay queues every register whose loaded value differs, so the FM registers come back while envelopes, phases and LFOs go on from the state before the load (A9, docs/SAVESTATES.md); not serialized, decision D9 (the C64 reads none of it)
- match: "emu.opl_inst.*"
  class: arch
  segment: OPL3

