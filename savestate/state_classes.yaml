- match: "emu.iec_drive.c1541.drives[1].c1541_drv.c1541_logic.extram.ram"
  class: region
  segment: EXTRAM_DRV9
- match: "emu.iec_drive.c1541.drives[0].c1541_drv.c1541_direct_gcr.buffer.rams[?].bitmem.ram"
  class: region
  segment: TRACK_DRV8
- match: "emu.iec_drive.c1541.drives[1].c1541_drv.c1541_direct_gcr.buffer.rams[?].bitmem.ram"
  class: region
  segment: TRACK_DRV9
- match: "emu.iec_drive.c1581.drives[0].c1581_drv.ram.ram"
  class: region
  segment: RAM_1581_8
- match: "emu.iec_drive.c1581.drives[1].c1581_drv.ram.ram"
  class: region
  segment: RAM_1581_9
- match: "emu.iec_drive.c1581.drives[0].c1581_drv.fdc.fifo.ram"
  class: region
  segment: FDC_BUF_8
- match: "emu.iec_drive.c1581.drives[1].c1581_drv.fdc.fifo.ram"
  class: region
  segment: FDC_BUF_9
- match: "emu.opl_inst.shadow"
  class: region
  segment: OPL3_REGS
# block RAM port registers of the region memories (see header)
- match: "emu.iec_drive.c1541.drives[?].c1541_drv.c1541_logic.ram.*"
  class: rebuilt
  reason: block RAM port register of the 1541 RAM (address/we/q), rewritten every clock from the saved CPU bus (port a writes, port b reads); settles in 2 clocks while paused
- match: "emu.iec_drive.c1541.drives[?].c1541_drv.c1541_logic.extram.*"
  class: rebuilt
  reason: block RAM port register of the 1541 RAM expansion (address/we/q), rewritten every clock from the saved CPU bus; settles in 2 clocks while paused
- match: "emu.iec_drive.c1541.drives[?].c1541_drv.c1541_direct_gcr.buffer.rams[?].bitmem.*"
  class: rebuilt
  reason: block RAM port register of the GCR track buffer (port a from the DDR3 DMA, port b from the saved head position buff_addr/buff_we/ht), rewritten every clock from those inputs
- match: "emu.iec_drive.c1541.drives[?].c1541_drv.c1541_direct_gcr.buffer.b_sel_d*"
  class: rebuilt
  reason: 2-stage delay of buff_addr[5:3] selecting the head bit of the track buffer, rewritten every clock from the saved buff_addr
- match: "emu.iec_drive.c1581.drives[?].c1581_drv.ram.*"
  class: rebuilt
  reason: block RAM port register of the 1581 RAM (address/we/q), rewritten every clock from the saved CPU bus; settles in 2 clocks while paused
- match: "emu.iec_drive.c1581.drives[?].c1581_drv.fdc.fifo.q_?"
  class: rebuilt
  reason: block RAM read register of the WD1772 sector buffer, rewritten every clock from the saved fifo pointers
- match: "emu.opl_inst.shadow_q"
  class: rebuilt
  reason: block RAM read register of the OPL3 register shadow, rewritten every clock from the region address (engine) or the replay step
- match: "emu.opl_inst.fmreg_q"
  class: rebuilt
  reason: block RAM read register of fmreg, rewritten every clock from the replay step
- match: "emu.tape.tap_time_map.rd_data"
  class: rebuilt
  reason: block RAM read register of the tape time map, rewritten every clock from tap_map_rdaddr; read only when tap_map_update_d, two clocks after the address is set

# ============================================================== Framework outside the machine

- match: "emu.hps_io.*"
  class: ignored
  reason: HPS interface (OSD status, ioctl, sd buffers); host side, not machine state
- match: "emu.video_mixer.*"
  class: ignored
  reason: video output path after the VIC, recomputed every frame
- match: "emu.video_freak.*"
  class: ignored
  reason: aspect/crop scaler settings, derived from OSD options
- match: "emu.drv_ovl.*"
  class: ignored
  reason: drive debug/activity overlay, recomputed every frame
- match: "emu.sync.*"
  class: ignored
  reason: video_sync, output sync/blank generator after the VIC (free-runs while paused); the machine reads only resume_ok, which times the pause release; while stopped its target position comes from the VIC raster (vic_x/vic_y), so after a load the machine resumes where the output reaches the loaded VIC, within a frame
- match: "emu.pause_fb.*"
  class: ignored
  reason: pause frame buffer for the analog output (last frame replayed while stopped); display only, refilled by the next frame
- match: "emu.pause_rel"
  class: ignored
  reason: pause release latch (waits for video_sync resume_ok); cleared while a savestate operation holds the machine
- match: "emu.pause_wd"
  class: ignored
  reason: watchdog of the pause release; cleared while a savestate operation holds the machine
- match: "emu.sdram.*"
  class: ignored
  reason: SDRAM controller in clk64 (and the sim memory model), idle at the freeze boundary; the machine areas of the SDRAM (RAM, GeoRAM, REU) are saved as regions, the media areas (CRT, TAP) are open questions in docs/A1_INVENTORY.md

# ============================================================== c64.sv (top level)

# PLL reconfiguration for PAL/NTSC (CLK_50M)
- match: "emu.cfg_*"
  class: ignored
  reason: PLL reconfiguration write sequence for the PAL/NTSC switch (CLK_50M); host clocking, ntsc is in config_mask
- match: "emu.ntsc_r"
  class: ignored
  reason: PAL/NTSC option in the CLK_50M domain (PLL reconfiguration); configuration, compared through config_mask
- match: "emu.ntscd*"
  class: ignored
  reason: synchroniser of the PAL/NTSC option into CLK_50M (PLL reconfiguration)
- match: "emu.state"
  class: ignored
  reason: PLL reconfiguration sequencer (CLK_50M)
- match: "emu.delay"
  class: ignored
  reason: PLL reconfiguration/OSD close delay for the PAL/NTSC switch (CLK_50M)
- match: "emu.osd_s?"
  class: ignored
  reason: synchroniser of OSD_STATUS for the PAL/NTSC switch (CLK_50M)
- match: "emu.close_osd"
  class: ignored
  reason: OSD close pulse to the HPS during a PAL/NTSC switch
- match: "emu.ntsc_sys1"
  class: ignored
  reason: synchroniser of the PAL/NTSC option into clk_sys; configuration (config_mask ntsc)
- match: "emu.ntsc"
  class: ignored
  reason: synchronised PAL/NTSC option; configuration (config_mask ntsc), follows the live option
- match: "emu.ntsc_prev"
  class: ignored
  reason: edge detector of the PAL/NTSC option (a change resets the machine); must follow the live option, restoring it could only fake a reset

# reset sequencer: constant at every freeze (the freeze needs reset_n, no
# reset_wait, no download/erase: idle bits 1 and 5), so it is rebuilt (A7)
- match: "emu.reset_n"
  class: rebuilt
  reason: reset sequencer output, 1 at every freeze (idle bit 1 needs reset_n) and kept by the idle sequencer; the same value before the save and after the load
- match: "emu.reset_counter"
  class: rebuilt
  reason: reset sequencer counter, 0 at every freeze (reset_n is !reset_counter, idle bit 1); the same value before the save and after the load
- match: "emu.reset_wait"
  class: rebuilt
  reason: PRG-load reset wait, 0 at every freeze (idle bit 1); the same value before the save and after the load
- match: "emu.do_erase"
  class: rebuilt
  reason: erase-on-reset flag, cleared every clock while the sequencer is idle (no download, no erase, counter 0), so 0 at every freeze
- match: "emu.old_download"
  class: ignored
  reason: edge detector of the host ioctl_download strobe, idle (0) at freeze and load; restoring it could only fake a download start
- match: "emu.old_download#2"
  class: ignored
  reason: edge detector of the host ioctl_download strobe, idle (0) at freeze and load; restoring it could only fake a download end

# host loader / RAM eraser (PRG/CRT/TAP/REU download, memory init, upload)
- match: "emu.ioctl_*"
  class: ignored
  reason: host download/upload engine (ioctl to SDRAM); idle unless the host is loading, and pause is released by any download (precondition P5)
- match: "emu.inj_*"
  class: ignored
  reason: PRG injection (BASIC pointer init) run by the host loader; idle outside downloads (P5)
- match: "emu.old_meminit"
  class: ignored
  reason: edge detector of inj_meminit (host PRG injection), idle outside downloads (P5)
- match: "emu.rd_cyc"
  class: ignored
  reason: read pipeline of the host upload (cartridge save), idle outside uploads (P5)
- match: "emu.erasing"
  class: ignored
  reason: RAM erase after reset/download, driven by the host loader engine (ioctl_load_addr); the engine does not save while erasing (P5)
- match: "emu.erase_*"
  class: ignored
  reason: RAM erase after reset/download, driven by the host loader engine; the engine does not save while erasing (P5)
- match: "emu.force_erase"
  class: ignored
  reason: request of the RAM erase after reset (host loader engine); the engine does not save while erasing (P5)
- match: "emu.old_st0"
  class: ignored
  reason: edge detector of the OSD "Reset & Detach" command (status[17])
- match: "emu.cart_blk_len"
  class: ignored
  reason: CRT file parser of the host loader (CHIP block length), only active during a CRT download
- match: "emu.cart_hdr_*"
  class: ignored
  reason: CRT file parser of the host loader (CHIP header), only active during a CRT download
- match: "emu.cart_bank_*"
  class: ignored
  reason: CRT file parser of the host loader (bank of the current CHIP block), only active during a CRT download
- match: "emu.cart_id_hi"
  class: ignored
  reason: CRT file parser of the host loader (high byte of the type), only active during a CRT download
- match: "emu.cart_id"
  class: ignored
  reason: type of the CRT image attached by the host (from the CRT header); describes the media in SDRAM, which is not in the slot (open question Q2, config_mask)
- match: "emu.cart_exrom"
  class: ignored
  reason: EXROM line from the attached CRT header; describes the media (see cart_id)
- match: "emu.cart_game"
  class: ignored
  reason: GAME line from the attached CRT header; describes the media (see cart_id)
- match: "emu.cart_attached"
  class: ignored
  reason: a CRT image is attached (set by the host CRT download, cleared by Reset & Detach); describes the media (see cart_id)
- match: "emu.ext_crt"
  class: ignored
  reason: the attached cartridge came from a .CRT file (host file type), used only for the EasyFlash write-back to the file
- match: "emu.ezfl_*"
  class: ignored
  reason: EasyFlash write-back of the flash content to the CRT file on the SD (host side)
- match: "emu.save_old"
  class: ignored
  reason: edge detector of the OSD EasyFlash save command
- match: "emu.ext_old"
  class: ignored
  reason: edge detector of ext_crt for the EasyFlash write-back (host side)

# SDRAM slot shared by the tape player and the loader
- match: "emu.io_cycle*"
  class: rebuilt
  reason: SDRAM request of the io_cycle slot (TAP prefetch or host loader), rewritten at the start of every io_cycle from the grid, tap_play_addr (saved in TAPE) and the idle loader; no edge while stopped (sysCycle held); the tape address pending at the freeze is recomputed on ss_load_done from the restored tap_play_addr

# keyboard input path and joystick-to-key macros: host input turned into PS/2
# key events; D3 releases every key after a load (kbd_reset on ss_load_done),
# so none of it is saved (A7)
- match: "emu.key"
  class: ignored
  reason: PS/2 key event pipe from the host into the keyboard matrix; its strobe bit (key[10]) must follow the live host strobe ps2_key[10], restoring it would replay or drop a key event
- match: "emu.joy_key"
  class: rebuilt
  reason: combinational decode of the joystick buttons, assigned with '=' at the top of the clocked block every clock before use
- match: "emu.joy_last"
  class: ignored
  reason: joystick-to-key macro (host input typed as PS/2 events); D3, keys are released after a load
- match: "emu.joy_finish"
  class: ignored
  reason: joystick-to-key macro (host input typed as PS/2 events); D3, keys are released after a load
- match: "emu.act"
  class: ignored
  reason: joystick-to-key macro (host input typed as PS/2 events); D3, keys are released after a load
- match: "emu.to"
  class: ignored
  reason: joystick-to-key macro autorepeat delay (host input typed as PS/2 events); D3, keys are released after a load
- match: "emu.start_strk"
  class: ignored
  reason: one-clock pulse at the end of the host RAM injection (PRG loader), idle outside downloads
- match: "emu.reset_keys"
  class: ignored
  reason: one-clock key matrix clear from the joystick-to-key macro (host input); D3

