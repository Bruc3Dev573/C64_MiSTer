# State classification for the B7 coverage lint (lint/state_inventory.py).
#
# Every flip-flop and inferred memory of the design must match one rule; the
# first matching rule wins. Paths are "<instance path>.<variable>", with the
# top instance called "emu" (VHDL process variables appear as "<proc>/<var>",
# same-named block variables of one module as "<var>#2", "<var>#3" in source
# order). In 'match', '*' is any text (dots included), '?' one character and
# brackets are literal: generate scopes are written as in the path (drives[0]).
#
#   arch     saved in the scan chain       -> needs segment (from map.yaml)
#   region   memory saved as a slot region -> needs segment = region name
#   rebuilt  not saved, rebuilt on load    -> needs reason
#   ignored  not machine state             -> needs reason
#
# A1 (inventory, docs/A1_INVENTORY.md) filled this file from the report of
# the full design; the human review of each chip PR reads only the 'rebuilt'
# reasons. Rule of thumb used: when in doubt it is arch.
#
# Two kinds of 'rebuilt' recur and rely on engine preconditions listed in
# docs/A1_INVENTORY.md:
#   - block RAM port registers (address/data/write-enable/q of the RAM
#     models): inside the M10K in hardware, rewritten every clock from the
#     port inputs, which are saved state; they settle in 2 clocks after load
#     while the machine is still paused (P1, P2);
#   - DDR3/SD transfer engines: the freeze waits until no burst is in flight
#     (P3), so the transfer registers hold only leftovers that are rewritten
#     at the start of the next transfer.

# ============================================================== ROMs, tables

- match: "emu.fpga64.buslogic.chargen*.ram"
  class: ignored
  reason: character ROM, loaded from the core, not machine state
- match: "emu.fpga64.buslogic.kernel_c64gs.ram"
  class: ignored
  reason: C64GS KERNAL ROM, read-only
- match: "emu.fpga64.buslogic.kernel_c64jap.ram"
  class: ignored
  reason: Japanese KERNAL ROM, read-only
- match: "emu.fpga64.buslogic.kernel_c64std.ram"
  class: ignored
  reason: standard KERNAL ROM, read-only
- match: "emu.fpga64.buslogic.kernel_c64.ram"
  class: ignored
  reason: loadable KERNAL ROM; the loaded image is part of the config, not of the slot (checked through build hash / config)
- match: "emu.fpga64.buslogic.*.q0"
  class: rebuilt
  reason: registered ROM output (dprom q0), rewritten every clock from the ROM at the saved bus address; read one clock later
- match: "emu.iec_drive.c1541.genblk1.rom.ram"
  class: ignored
  reason: 1541 drive ROM (loadable DOS/DolphinDOS image), content comes from the core or the host ROM file, read-only for the machine
- match: "emu.iec_drive.c1541.romstd.ram"
  class: ignored
  reason: standard 1541 DOS ROM, read-only
- match: "emu.iec_drive.c1581.genblk1.rom.ram"
  class: ignored
  reason: 1581 drive ROM (loadable image), read-only for the machine
- match: "emu.iec_drive.c1581.romstd.ram"
  class: ignored
  reason: standard 1581 DOS ROM, read-only
- match: "emu.iec_drive.c15?1.genblk1.rom.*"
  class: rebuilt
  reason: block RAM port register of the drive ROM (address/we/q), rewritten every clock from the port inputs (host ROM loader on port a, saved mem_a on port b), settles in 2 clocks while paused
- match: "emu.iec_drive.c15?1.romstd.*"
  class: rebuilt
  reason: block RAM port register of the drive ROM (address/we/q), rewritten every clock from the port inputs (host ROM loader on port a, saved mem_a on port b), settles in 2 clocks while paused
- match: "emu.iec_drive.c1541.rom_??k_i"
  class: ignored
  reason: size of the drive ROM image written by the host ROM loader (rom_wr); describes the loaded ROM file, which is configuration like the ROM itself
- match: "emu.iec_drive.c1541.rom_sz"
  class: rebuilt
  reason: rewritten every clock from rom_32k_i/rom_16k_i (ROM image size, configuration)
- match: "emu.fpga64.sid.sid_tables.f6581_curve"
  class: ignored
  reason: 6581 filter cutoff curve, initialized from the core and optionally replaced by the host filter file (ld_wr); configuration like a ROM, never written by the machine
- match: "emu.iec_drive.c1541.drives[?].c1541_drv.c1541_direct_gcr.rec"
  class: rebuilt
  reason: constant reciprocal table (1<<26)/(i+6000) set by its initializer; the only write (reset) stores the same constant in rec[0]

