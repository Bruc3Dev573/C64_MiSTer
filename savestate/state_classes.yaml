- match: "emu.iec_drive.c1541.drives[?].c1541_drv.c1541_track.scan_track"
  class: ignored
  reason: round-robin pointer of the SD write-back scan (host-side image persistence)
- match: "emu.iec_drive.c1541.drives[?].c1541_drv.c1541_track.sd_*"
  class: ignored
  reason: SD write-back handshake to the HPS (host side); no SD transfer in flight at the freeze boundary (P3)
- match: "emu.iec_drive.c1541.drives[?].c1541_drv.c1541_track.lba"
  class: ignored
  reason: SD block address of the write-back (host side)
- match: "emu.iec_drive.c1541.drives[?].c1541_drv.c1541_track.old_ack"
  class: ignored
  reason: edge detector of the host sd_ack (write-back done); idle at freeze and load
- match: "emu.iec_drive.c1541.drives[?].c1541_drv.c1541_track.dma_*"
  class: rebuilt
  reason: DDR3<->track buffer DMA transfer registers; the freeze boundary (idle bit 3, c1541_track ss_idle) has no foreground transfer running or about to start, and every one of them is set again at the start of the next transfer (IDLE dispatch, START_DMA, PREP_DDRAM_WRITE, READ_BUFF) before it is read; a background SD flush fetch may be in flight and keeps its live value (host side)
- match: "emu.iec_drive.c1541.drives[?].c1541_drv.c1541_track.ddr_offset_q"
  class: rebuilt
  reason: DDR3 address of the current DMA transfer; set in the IDLE dispatch / START_DMA / PREP_DDRAM_WRITE before any DDR3 request (P3)
- match: "emu.iec_drive.c1541.drives[?].c1541_drv.c1541_track.reset_sync.*"
  class: rebuilt
  reason: synchroniser of the unit reset (host/OSD level, released while the engine owns the machine); follows the live level, so a load never resets the host side of the track cache (SD write-back queue)
- match: "emu.iec_drive.c1541.drives[?].c1541_drv.c1541_direct_gcr.buff_we"
  class: rebuilt
  reason: head write pulse into the track buffer, set on a drive clock enable and cleared on the next clock; 0 whenever the machine is stopped, so it never shifts (a bit passing through would write the track buffer)
- match: "emu.iec_drive.c1541.drives[?].c1541_drv.c1541_logic.cpu.res_n_?"
  class: rebuilt
  reason: reset synchroniser of the drive T65 (asynchronous reset of its registers, never shifts); the unit reset is released while the engine owns the machine, so it is 1 two clocks later, long before the chain moves
- match: "emu.iec_drive.c1541.drives[?].c1541_drv.c1541_logic.uc?.phi2_ref"
  class: ignored
  reason: phi2_ref output of the VIA, not connected in the 1541
- match: "emu.iec_drive.c1541.drives[?].c1541_drv.disk_ready"
  class: rebuilt
  reason: rewritten every clock from the mount sequence (state, phase_timer, saved); only gates the keyboard and lights the LED during a disk change, held at the c1541_multi output while the engine owns the machine
- match: "emu.iec_drive.c1541.drives[?].c1541_drv.readonly"
  class: ignored
  reason: write protect of the mounted image (host, latched at its mount); the saved mount sequence reads it, so a load keeps the image that is mounted
- match: "emu.iec_drive.c1541.drives[?].c1541_drv.present"
  class: ignored
  reason: an image is mounted (host, latched at its mount); the saved mount sequence reads it, so a load keeps the image that is mounted
- match: "emu.iec_drive.c1541.drives[?].c1541_drv.mount_id"
  class: ignored
  reason: identity of the mounted image (free-running count sampled at its mount, host side); a load compares it with the saved copy ss_mount_id and, when they differ, drops the saved track write-back and reloads the track from the mounted image
- match: "emu.iec_drive.c1541.drives[?].c1541_drv.ss_rgn_*"
  class: ignored
  reason: savestate region port of the unit (RAM, EXTRAM, TRACK); runs the save/load, not machine state
- match: "emu.iec_drive.c1541.drives[0].*"
  class: arch
