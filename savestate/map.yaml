# C64 savestate map - single source of truth (WP B8).
#
# tools/ss/gen_ss_map.py turns this file into:
#   rtl/savestate/c64_savestates_pkg.vhd   VHDL constants
#   rtl/savestate/c64_savestates.vh        Verilog defines
#   tools/ss/ss_map.py                     map used by decode_ss.py (B6)
#   docs/savestate_vice_map.md             VICE snapshot module -> MiSTer segment
# CI regenerates them and fails if the committed copies differ.
#
# Contract (plan section "Architettura target"):
# - registers travel on one scan chain in clk_sys; a segment is a contiguous
#   piece of it owned by one module (scan_en / scan_in / scan_out);
# - 'addr' and 'words' keep the 64-bit word address map of the plan so the
#   slot layout stays readable and decode_ss can index it. The plan reserved
#   words 0-127; the A1 inventory needs ~172 words of arch bits, so the map
#   now spans 0-255 (gen_ss_map.py MAX_WORDS, see docs/A1_INVENTORY.md);
# - 'fields' are the chain bits of each segment in chain order. A1 filled
#   them from the state inventory (tools/ss/inventory_fields.py prints them
#   from lint/build/inventory.csv); chip WPs may rename/reorder them. The B7
#   lint (lint/run_inventory.sh --fail-unclassified) fails when the bits of
#   the fields differ from the arch bits classified in
#   savestate/state_classes.yaml. 'words' keeps one spare word per segment;
# - memories are regions (TLV in the slot), not chain segments.
#
# Do not edit this file inside a chip branch: changes go through their own PR.

format:
  version: 1
  word_bits: 64
  slots: 4
  slot_bytes: 0x800000        # config string token SS3E000000:800000 (D2: GeoRAM + EasyFlash fit)
  ddr_base: 0x3E000000
  header:
    - {name: statesize, bits: 32}
    - {name: change_counter, bits: 32}
  payload_header:
    - {name: format_version, bits: 16}
    - {name: chain_bits, bits: 16, note: "live chain bits (instrumented segments), compared on load"}
    - {name: build_hash, bits: 32}
    - {name: crc32, bits: 32}
    - {name: config_mask, bits: 32}

# Configuration bits compared on load (config_mask). A slot made with a
# different value is refused.
config_mask:
  - {name: reu_size, bits: 2, status: "54:53"}
  - {name: georam, bits: 1, status: "52"}
  - {name: drive8_type, bits: 1, note: "1541/1581 from mounted image"}
  - {name: drive9_type, bits: 1, note: "1541/1581 from mounted image"}
  - {name: sid_left_model, bits: 1, status: "13"}
  - {name: sid_right_model, bits: 1, status: "16"}
  - {name: ntsc, bits: 1, status: "2"}
  - {name: vic_variant, bits: 2, status: "35:34"}
  - {name: cia_model, bits: 1, status: "45"}
  - {name: opl_enable, bits: 1, status: "12"}
  - {name: kernal, bits: 2, status: "15:14", note: "D2: System ROM selection"}
  - {name: cart_type, bits: 8, note: "D2: CRT hardware type (cart_id) of the attached cartridge, 255 = none"}

# Scan-chain segments in chain order. 'vice' is the VICE snapshot module that
# holds the same state (B5/C3 comparisons); '?' marks names still to verify
# against a real .vsf dump.
