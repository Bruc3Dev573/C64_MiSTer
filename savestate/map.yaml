regions:
  - {tag: 0x01, name: RAM,        bytes: 65536,  port: sdram_walk, vice: C64MEM,  stage: v1}
  - {tag: 0x02, name: COLORRAM,   bytes: 1024,   port: bram_b,     vice: C64MEM,  stage: v1, note: "4 bit per byte, padded"}
  - {tag: 0x03, name: RAM_DRV8,   bytes: 2048,   port: bram_a,     vice: "DRIVERAM0?", stage: v1, note: "A8: 1541 RAM (c1541_logic ram), byte port on port a while the engine owns the machine"}
  - {tag: 0x04, name: RAM_DRV9,   bytes: 2048,   port: bram_a,     vice: "DRIVERAM1?", stage: v1}
  - {tag: 0x05, name: RAM_1581_8, bytes: 8192,   port: bram_a,     vice: "DRIVERAM0?", stage: v1, note: "A10: 1581 RAM (c1581_drv ram), written on port a (CPU write port) and read on port b (CPU read port) while the engine owns the machine; always in the slot"}
  - {tag: 0x06, name: RAM_1581_9, bytes: 8192,   port: bram_a,     vice: "DRIVERAM1?", stage: v1, note: "1581 RAM of unit 9"}
  - {tag: 0x0A, name: EXTRAM_DRV8, bytes: 8192, port: bram_a,     vice: "DRIVERAM0?", stage: v1, note: "1541 RAM expansion at $8000-$9FFF (c1541_logic extram), used with the parallel/DolphinDOS ROM (ext_en); A8: always in the slot"}
  - {tag: 0x0B, name: EXTRAM_DRV9, bytes: 8192, port: bram_a,     vice: "DRIVERAM1?", stage: v1, note: "1541 RAM expansion of unit 9"}
  - {tag: 0x0C, name: TRACK_DRV8, bytes: 8192,   port: bram_a,     vice: "DRIVE?",     stage: v1, note: "1541 GCR track buffer (c1541_direct_gcr, 8 x 1 KB BRAM, byte lanes of the 64-bit port a); holds head writes not yet written back to the DDR3 image"}
  - {tag: 0x0D, name: TRACK_DRV9, bytes: 8192,   port: bram_a,     vice: "DRIVE?",     stage: v1, note: "1541 GCR track buffer of unit 9"}
  - {tag: 0x0E, name: FDC_BUF_8,  bytes: 1024,   port: bram_a,     stage: v1, note: "A10: WD1772 sector buffer of the 1581 (fdc1772 fifo, 512 bytes used), on its SD port a while the engine owns the machine; holds a sector read from the image or written by the drive CPU before it reaches the SD; always in the slot"}
  - {tag: 0x0F, name: FDC_BUF_9,  bytes: 1024,   port: bram_a,     stage: v1, note: "WD1772 sector buffer of unit 9"}
  - {tag: 0x12, name: OPL3_REGS,  bytes: 256,    port: bram_a,     vice: "CARTSFXSE?", stage: v1, optional: true, note: "A9: shadow of the OPL registers the C64 wrote (opl3.sv); after a load the registers that differ from what the FM part has are queued into it; present with the Sound Expander on"}
  - {tag: 0x13, name: CART_RAM,   bytes: 65536,  port: sdram_walk, stage: v1, optional: true, note: "D2: cartridge RAM banks in SDRAM at 0x010000 (cartridge.v get_bank ram), when a CRT is attached; the EasyFlash RAM ($DF00-$DFFF) is bank 0 at 0x011F00"}
  - {tag: 0x14, name: CART_FLASH, bytes: 1048576, port: sdram_walk, stage: v1, optional: true, note: "D2: EasyFlash flash in SDRAM at 0x200000 (programs can erase/program it), when an EasyFlash CRT is attached"}
  - {tag: 0x08, name: GEORAM,     bytes: 4194304, port: sdram_walk, vice: GEORAM, stage: v1, optional: true, note: "GeoRAM in SDRAM at 0x0C00000 ({3'b011, geo_bank}, the page register is in CART), when GeoRAM is on and no CRT is attached"}
  - {tag: 0x09, name: REU_RAM,    bytes: 16777216, port: sdram_walk, vice: REU1764, stage: v1, optional: true, note: "size from REU option, last region"}
